name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2

      - run: composer validate --no-check-publish
      - run: find lib tests templates -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - run: bash scripts/check-integration-discipline.sh
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/phpunit --testsuite unit
      - run: ./vendor/bin/phpunit --testsuite integration
      - run: node --test tests/js/at-integration-ux.test.mjs
      - run: node --test tests/js/api-abort-lifecycle.test.mjs tests/js/network-error-nav-contracts.test.mjs
      - run: php tests/Mutation/run-at-integration-mutations.php
      - run: php tests/Mutation/run-api-abort-mutations.php
